[project]
name = "opencode-agent-toolkit"
version = "0.1.0"
description = """An extensible Python toolkit for opencode agents as a simple MCP alternative. 
Run scripts directly via terminal. Kicking off with multi-mode search (Raw, Default, Max), with many more tools on the way!"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.6.0",
    "python-dotenv>=1.2.3",
    "uv>=0.12.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
